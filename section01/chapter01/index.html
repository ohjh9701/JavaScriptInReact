<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>실습</title>
        <script src="./chapter30.js"></script>
        <script>
            function onClick() {
                const $ul = document.getElementById("ul");

                for (let i = 0; i < 3000; i++) {
                    $ul.innerHTML = $ul.innerHTML + `<li>${i}</li>`
                }
            }
            function onClick2() {
                const $ul = document.getElementById("ul");
                let listValue = "";

                for (let i = 0; i < 30000; i++) {
                    listValue = listValue + `<li>${i}</li>`
                }
                $ul.innerHTML = listValue;
            }

        </script>
    </head>
    <body>
        <h2>안녕하세요</h2>
        <button type="button" onclick="onClick()">리스트 추가하기(실제돔)</button>
        <button type="button" onclick="onClick2()">리스트 추가하기(가상돔)</button>
        <ul id="ul"></ul>
        <ul id="ul"></ul>
    </body>
</html>

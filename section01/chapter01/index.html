<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>실습</title>
        <style>
          h2{
            background-color: rgb(173, 1, 1);
            color: rgb(255, 255, 255);
            font-size: large;
            font-weight: 700;
          }

          #btn {
            width: 100px;
            height: 50px;
            background-color: brown;
            color: white;
          }

        </style>
    </head>
    <body>
        <h2>안녕하세요</h2>
        <button type="button" id="btn" onclick="alertCall()">클릭</button>

        <script>
          function alertCall() {
            alert("안녕하냐고");
          }

        </script>
    </body>
</html>
